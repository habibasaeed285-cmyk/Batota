<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة خطوبة فاطمة وحازم</title>
    <!-- استدعاء خطوط عربية شيك من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* الخلفية الدانتيل اللي اخترتيها */
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Amiri', serif;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تصميم الظرف */
        .envelope-wrapper {
            cursor: pointer;
            transition: transform 0.6s ease, opacity 0.6s ease;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        .envelope-wrapper img {
            width: 100%;
            max-width: 380px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(139, 115, 85, 0.25);
        }

        .tap-hint {
            margin-top: 15px;
            font-size: 1.3rem;
            color: #6b533b;
            background: rgba(255, 250, 240, 0.85);
            padding: 8px 20px;
            border-radius: 25px;
            border: 1px solid #d4c4b0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* تصميم الكارت الداخلي (الورقة) */
        .card-wrapper {
            display: none; /* مخفي في البداية */
            position: relative;
            width: 100%;
            max-width: 420px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(90, 70, 50, 0.3);
            animation: openCard 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-bg {
            width: 100%;
            display: block;
        }

        /* الكلام المكتوب فوق الجزء الفاضي في ورقة الآية */
        .card-details {
            position: absolute;
            top: 49%; /* بيبدأ تحت مخطوطة "وخلقناكم أزواجاً" مباشرة */
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            text-align: center;
            color: #4a3723; /* لون بني كلاسيك متناسق مع لون الآية */
        }

        .intro-text {
            font-size: 1.05rem;
            margin-bottom: 6px;
            color: #6e553b;
        }

        .names {
            font-family: 'Aref Ruqaa', serif;
            font-size: 2.3rem;
            font-weight: bold;
            color: #3b2816;
            margin: 5px 0 10px 0;
            line-height: 1.3;
        }

        .names span {
            color: #9e7b56;
            font-size: 1.8rem;
            margin: 0 5px;
        }

        .invite-msg {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .date-box {
            border-top: 1px solid rgba(158, 123, 86, 0.4);
            border-bottom: 1px solid rgba(158, 123, 86, 0.4);
            padding: 6px 0;
            margin: 8px auto;
            width: 85%;
            font-size: 1.25rem;
            font-weight: bold;
            color: #4a3723;
            letter-spacing: 1px;
        }

        .countdown {
            font-size: 0.9rem;
            color: #7d6246;
            margin-top: 8px;
            font-weight: bold;
        }

        /* حركات الأنيميشن */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes openCard {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* تظبيط المقاسات للموبايل الصغير */
        @media (max-width: 380px) {
            .names { font-size: 1.9rem; }
            .intro-text, .invite-msg { font-size: 0.9rem; }
            .date-box { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الظرف -->
        <div class="envelope-wrapper" id="envelope" onclick="openInvitation()">
            <img src="envelope.jpg" alt="ظرف الدعوة">
            <div class="tap-hint">✨ اضغط لفتح الدعوة ✨</div>
        </div>

        <!-- الورقة اللي فيها الآية والتفاصيل -->
        <div class="card-wrapper" id="card">
            <img src="card.jpg" alt="دعوة خطوبة" class="card-bg">
            
            <div class="card-details">
                <p class="intro-text">تتشرف عائلتا العروسين بدعوتكم لحضور حفل خطوبة</p>
                
                <div class="names">
                    فاطمة <span>&</span> حازم
                </div>

                <p class="invite-msg">مشاركتكم تزيد فرحتنا بهجة وسروراً</p>

                <div class="date-box">
                    الجمعة 20 / 11 / 2026
                </div>

                <!-- عداد تنازلي لليوم -->
                <div class="countdown" id="timer"></div>
            </div>
        </div>
    </div>

    <script>
        function openInvitation() {
            const envelope = document.getElementById('envelope');
            const card = document.getElementById('card');

            // إخفاء الظرف بنعومة
            envelope.style.opacity = '0';
            envelope.style.transform = 'scale(1.1)';

            setTimeout(() => {
                envelope.style.display = 'none';
                card.style.display = 'block';
            }, 400);
        }

        // كود العداد التنازلي ليوم 20/11/2026
        const targetDate = new Date("Nov 20, 2026 19:00:00").getTime();

        const timerInterval = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                clearInterval(timerInterval);
                document.getElementById("timer").innerHTML = "اليوم هو يوم الفرحة المنتظر! 🎉";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

            document.getElementById("timer").innerHTML = `متبقي: ${days} يوم و ${hours} ساعة`;
        }, 1000);
    </script>

</body>
</html>
